name: Appli Android (APK)

# Se lance à chaque envoi sur main, ou à la main depuis l'onglet « Actions ».
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier l'APK dans « Releases »

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (embarqué dans l'appli)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Copier le site dans le projet Android
        run: npx cap sync android

      - name: Récupérer la clé de signature (secret GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/YVES-STORE.apk"

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs YVES-STORE.apk | head -5

      - name: Garder l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: YVES-STORE-apk-${{ env.APP_VERSION_NAME }}
          path: YVES-STORE.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: YVES STORE ${{ env.APP_VERSION_NAME }} (Android)
          make_latest: true
          files: YVES-STORE.apk
          body: |
            Appli Android YVES STORE — version ${{ env.APP_VERSION_NAME }}.
            Installation : téléchargez **YVES-STORE.apk** sur le téléphone, ouvrez-le, puis autorisez « Installer des applis inconnues » si Android le demande.
            Lien permanent vers la dernière version : https://github.com/${{ github.repository }}/releases/latest/download/YVES-STORE.apk
